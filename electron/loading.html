<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>HayPDF</title>
    <style>
      :root { --surface: #19171f; --text: #f5f2fa; --muted: #bdb3cd; --accent: #ae8ced; --line: #393044; }
      body { margin: 0; height: 100vh; display: grid; place-content: center; justify-items: center; background: var(--surface); color: var(--text); font-family: "Segoe UI", sans-serif; -webkit-app-region: drag; }
      img { width: 64px; height: 64px; }
      .spinner { margin-top: 24px; width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <div class="spinner" role="progressbar" aria-label="HayPDF"></div>
  </body>
</html>
